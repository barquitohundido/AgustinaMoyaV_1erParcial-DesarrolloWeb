<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1er Parcial Front End</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="nav-left">
                <a href="#"><img src="img/logo.png" class="nav-icon" alt="Logo"></a>
                <h5>Character Counter</h5>
            </div>
            <button href="#" class="btn-nav"><img src="img/sol.svg" class="img-button"></button>
        </nav>
    </header>    
    <main>
        <section class="hero">
            <div>
                <h1 class="hero-h1">Analyze your text in real-time.</h1>
                <textarea placeholder="Design is the silent ambassador of your brand. Simplicity is key to effective communication, creating clarity in every interaction. A great design transforms complex ideas into elegant solutions, making them easy to understand. It blends aesthetics and functionality seamlessly."></textarea>
            </div>
            <div class="hero-font-options">
                <div class="container-checkboxes">
                    <label class="checkboxes">
                        <input type="checkbox">Exclude spaces
                    </label>
                    <label class="checkboxes">
                        <input type="checkbox">Set Character Limit
                    </label>
                </div>
                <p class="reading-time">Aprox reading time: >1 minute</p>
            </div>
        </section>
        <section class="container-imgs">
            <div class="container-img1">
                <h3 class="number-img">278</h3>
                <p>Total Characters</p>
            </div>
            <div class="container-img2">
                <h3 class="number-img">39</h3>
                <p>World Count</p>
            </div>
            <div class="container-img3">
                <h3 class="number-img">04</h3>
                <p>Sentence Count</p>
            </div>
        </section>
        <section class="progress-letter">
            <h2 class="density">Letter Density</h2>
            <div class="e-letter letters">
            <h4>E</h4>
            <progress value="70" max="100">20</progress>
            <h6>40 (16.06%)</h6>
            </div>            
            <div class="i-letter letters">
                <h4>I</h4>
                <progress value="40" max="100">40</progress>
                <h6>29 (11.65%)</h6>
            </div>
            <div class="t-letter letters">
                <h4>T</h4>
                <progress value="40" max="100">40</progress>
                <h6>28 (11.24%)</h6>
            </div>
            <div class="o-letter letters">
                <h4>O</h4>
                <progress value="40" max="100">40</progress>
                <h6>22 (8.84%)</h6>
            </div>
            <div class="n-letter letters">
                <h4>N</h4>
                <progress value="40" max="100">40</progress>
                <h6>21 (8.43%)</h6>
            </div>
            <a href=""><h6>See more ↓</h6></a>
        </section>
    </main>
</body>
</html>
